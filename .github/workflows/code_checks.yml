name: code checks

on:
  push:
    branches:
      - main
      - develop
    paths:
      - .pre-commit-config.yaml
      - .github/workflows/code_checks.yml
      - '**.py'
      - uv.lock
      - pyproject.toml
      - '**.ipynb'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - .pre-commit-config.yaml
      - .github/workflows/code_checks.yml
      - '**.py'
      - uv.lock
      - pyproject.toml
      - '**.ipynb'

jobs:
  run-code-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          # Install a specific version of uv.
          version: "0.5.21"
          enable-cache: true
      - name: "Set up Python"
        uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"
      - name: Install the project
        run: uv sync --dev --prerelease=allow
      - name: Install dependencies and check code
        run: |
          source .venv/bin/activate
          pre-commit run --all-files
      - name: pip-audit (gh-action-pip-audit)
        uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          virtual-environment: .venv/
          # Temporary: ignore pip advisory until fixed in pip>=25.3.
          # filelock CVE-2026-1129xx: fixed only in filelock>=4.2.1, which needs
          # Python>=3.11. uv.lock uses 4.2.4 on 3.11+, but this job runs on 3.10
          # (.python-version), where 4.1.0 is the newest installable release.
          # Remove once Python 3.10 support is dropped.
          ignore-vulns: >-
            GHSA-4xh5-x5gv-qwph
            CVE-2026-112906
            CVE-2026-112907
            CVE-2026-112913
            CVE-2026-112914
            CVE-2026-112937
            CVE-2026-112940
